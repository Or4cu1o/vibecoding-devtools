# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# .coderabbit.yaml template (copy to the repository root and adjust the TODOs).
# Reference: https://docs.coderabbit.ai/reference/configuration
# Problem solved: noisy reviews (poems, diagrams, test suggestions to raise coverage) and enforcing generic rules
# the project has replaced. Cost avoided: PR cycles spent on low-value comments.

language: en-US
tone_instructions: >-
  Objective technical reviewer, in English. Focus on bugs, security and regressions. Cite file:line, group repetitions
  into a single comment and do not praise.
inheritance: false

reviews:
  profile: chill
  # Branch protection blocks merges; the checks below only flag issues.
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  poem: false
  in_progress_fortune: false
  suggested_reviewers: false
  suggested_labels: false
  auto_apply_labels: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"

  path_filters:
    # TODO: project lockfiles, binary assets, vendor and generated files.
    - "!**/*.min.js"
    - "!**/*.min.css"

  path_instructions:
    - path: "**/*"
      instructions: |
        - `AGENTS.md`, `CLAUDE.md` and project rules override generic rules (ECC). Do not request tests just to raise
          coverage or TDD outside bug fixes and pure rules.
        - Follow the item's risk level: for text, styling, docs or configuration changes, flag only actual bugs.
        - Never describe an exploitable vulnerability detail in a public comment; point to the file and request a
          private report.
    # TODO: area-specific instructions (e.g. money, authentication, personal data folders) referring to the
    # security-surfaces skill and the project's risk map.

  pre_merge_checks:
    docstrings:
      mode: off
    title:
      mode: warning
      requirements: >-
        Conventional Commits: type (feat, fix, refactor, docs, test, chore, perf, ci), optional scope and short
        description.
    description:
      mode: warning
    issue_assessment:
      mode: off
    custom_checks:
      - name: "CHANGELOG updated"
        mode: warning
        instructions: |
          If the PR changes production code, Dockerfiles or dependencies (not only tests or documentation), the diff
          must include an entry under `[Unreleased]` in CHANGELOG. Pass if the entry exists or the PR does not touch
          these paths.
      - name: "No secrets or exploitable details"
        mode: error
        instructions: |
          Fail if the diff adds a real secret (token, API key, password, webhook URL, connection string with
          credentials)
          or exploitable steps for an unfixed vulnerability to a public file.
          Clearly fake synthetic values in tests and empty variables in `.env.example` pass.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    # TODO: enable stack linters (ruff, eslint, biome, golangci-lint) and disable redundant ones.
    actionlint:
      enabled: true
    hadolint:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    zizmor:
      enabled: true
    github-checks:
      enabled: true
    languagetool:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      # TODO: project rules, for example ".claude/rules/<project>/*.md".
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
